  <script>
    // Set theme immediately to avoid flash
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      --date-color: #aaa;
      --star-color: rgba(255, 255, 255, 1);
      --comet-color: rgba(255, 255, 255, 1);

    :root[data-theme="light"] {

    h2 {
      font-size: 2.2rem;
      margin-bottom: 0.55rem;
    }

    h3 {
      font-size: 1.5rem;
      margin-top: 1.1rem;
      margin-bottom: 0.55rem;
    }

    p {

      padding-bottom: 0.55rem;

    }

    canvas {

      top: 0;
      left: 0;
      z-index: -1;
    }

    body {
      overflow-x: clip;
      background-color: var(--bg-color);
    }

    .container {
      margin: auto;
      margin-top: unset;
      margin-bottom: unset;
      max-width: 71.5ch;
      padding: 0.55rem;
    }

    button {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.55rem;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 0.55rem;
      margin-bottom: 0.55rem;
      backdrop-filter: blur(10px) brightness(var(--backdrop-brightness));
    }

    button:hover:not(:disabled) {
      background-color: var(--button-hover-bg);
      color: var(--button-hover-text);
    }

    .dashed {
      border: 1px dashed var(--border-color);
      box-sizing: border-box;
    }

    .backdrop {
      backdrop-filter: blur(10px) brightness(var(--backdrop-brightness));
    }

    .menu-bar {
      display: flex;
      justify-content: space-between;
      gap: 0.55rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      padding-top: 0;
      padding-bottom: 0;
    }

    .menu-bar button {
      flex: 1;
      margin-top: 0;
      margin-bottom: 0;
    }

    #theme-toggle {
      font-size: 1.2rem;
      line-height: 1;
    }

    .menu-bar button.active {
      box-shadow: 4px 4px 0px 0px #F43208;
    }

    .post-content {
      padding: 1.1rem;
    }

    .content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1.1rem 0;
    }

    .content a {
      display: inline;
    }

    .content a img {
      cursor: pointer;
    }

    .post-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.1rem;
      margin-bottom: 1.1rem;
      gap: 1.1rem;
    }

    .nav-arrow {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: var(--text-color);
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .nav-arrow:hover {
      opacity: 1;
    }

    .nav-arrow .arrow {
      font-size: 1.5rem;
    }

    .nav-arrow .nav-title {
      font-style: italic;
      font-size: 0.95rem;
    }

    .prev-post {
      justify-content: flex-start;
    }

    .next-post {
      justify-content: flex-end;
      margin-left: auto;
    }

    .footnote {
      margin-top: 1.1rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    .footnote-anchor {
      vertical-align: super;
      font-size: 0.8rem;
      text-decoration: none;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 1.1rem 0;
    }
  </style>
</head>
<body>

  <div class="container" style="margin-top: 1.1rem; margin-bottom: 1.65rem;">
    <button id="return-to-top">↑ return to top</button>
  </div>

  <script src="../starfield.js"></script>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    function setTheme(theme) {
      if (theme === 'light') {
        root.setAttribute('data-theme', 'light');
        themeToggle.textContent = '☽';
      } else {
        root.removeAttribute('data-theme');
        themeToggle.textContent = '☀';
      }
      localStorage.setItem('theme', theme);
      window.starfield.refresh();
    }

    function toggleTheme() {
      const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    themeToggle.addEventListener('click', toggleTheme);
    setTheme(localStorage.getItem('theme') || 'dark');

    document.getElementById('home-btn').addEventListener('click', () => window.location.href = '../index.html');
    document.getElementById('gallery-btn').addEventListener('click', () => window.location.href = '../gallery.html');
    document.getElementById('collection-btn').addEventListener('click', () => window.location.href = '../collection.html');
    document.getElementById('return-to-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>
